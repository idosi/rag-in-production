# Runs on every push to main and on every pull request.
# Two independent jobs, so a Docker problem and a test failure show up separately:
#   test    lint + the whole test suite against a real Postgres with pgvector
#   docker  the image still builds (not pushed anywhere)
#
# What CI deliberately does NOT run: the evals (make eval-*). They call the paid
# Claude API and take minutes. They run on demand, before changing the model, the
# prompt or the retrieval settings.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow token can only READ the repository. Least privilege.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real database next to the tests, the same image as docker-compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      # --frozen: fail if uv.lock does not match pyproject.toml, instead of silently
      # resolving different versions than the ones we tested locally.
      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests

      # The tests create their own rag_test database (see tests/conftest.py).
      # No ANTHROPIC_API_KEY here: the tests use fakes and never call the API.
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Reuse layers between runs: the dependency and model layers rarely change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
