# More than 3 errors (5xx except the budget 503) in 10 minutes. Needs the rag_errors metric:
#   gcloud logging metrics create rag_errors --log-filter='resource.type="cloud_run_revision"
#     resource.labels.service_name="rag-api" jsonPayload.status>=500 jsonPayload.status!=503'
#   gcloud alpha monitoring policies create --policy-from-file=monitoring/alert_errors.yaml \
#     --notification-channels=CHANNEL_NAME
displayName: "rag-api: 5xx errors"
combiner: OR
conditions:
  - displayName: more than 3 errors in 10 minutes
    conditionThreshold:
      filter: >
        metric.type="logging.googleapis.com/user/rag_errors"
        resource.type="cloud_run_revision"
      comparison: COMPARISON_GT
      thresholdValue: 3
      duration: 0s
      aggregations:
        - {alignmentPeriod: 600s, perSeriesAligner: ALIGN_SUM}
alertStrategy: {autoClose: 1800s}
