# Any request refused because the daily budget is used up (503): customers get no answers.
#   gcloud logging metrics create rag_budget_rejections --log-filter='resource.type="cloud_run_revision"
#     resource.labels.service_name="rag-api" jsonPayload.status=503'
#   gcloud alpha monitoring policies create --policy-from-file=monitoring/alert_budget.yaml \
#     --notification-channels=CHANNEL_NAME
displayName: "rag-api: daily budget used up (503)"
combiner: OR
conditions:
  - displayName: at least one budget refusal in 10 minutes
    conditionThreshold:
      filter: >
        metric.type="logging.googleapis.com/user/rag_budget_rejections"
        resource.type="cloud_run_revision"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s
      aggregations:
        - {alignmentPeriod: 600s, perSeriesAligner: ALIGN_SUM}
alertStrategy: {autoClose: 1800s}
