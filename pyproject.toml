[project]
name = "rag-in-production"
version = "0.1.0"
description = "Production-grade RAG over the FastAPI docs, built as a learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.5",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
